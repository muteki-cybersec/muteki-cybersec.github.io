*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--mono:ui-monospace,"JetBrains Mono","SF Mono","Cascadia Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace}
html,body{margin:0;background:#121212;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:center;color:#ececec;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:340px;padding:0 20px;margin-top:5vh;text-align:center}
.logo{display:block;width:144px;height:144px;margin:0 auto 30px}
h1{margin:0 0 21.5px;font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:1px}
.bio{margin:0 0 30px;font-family:var(--mono);font-size:11.5px;line-height:1.74;letter-spacing:-.1px;color:#a3a3a3}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.b{display:flex;flex-direction:column;align-items:center;justify-content:center;height:48px;padding:0 8px;background:#2a2a2a;border:1px solid #3a3a3a;border-radius:11px;box-shadow:0 1px 3px rgba(0,0,0,.35);color:#d4d4d4;font-family:var(--mono);font-size:13px;letter-spacing:.2px;text-decoration:none;cursor:pointer;touch-action:manipulation;transition:border-color .15s,background .15s}
.b:hover{border-color:#4d4d4d;background:#303030}
.b:focus-visible{border-color:#4d4d4d;background:#303030;outline:2px solid #6f6f6f;outline-offset:2px}
.b:active{background:#363636}
.b{position:relative}
.i{position:absolute;left:14px;top:50%;width:16px;height:16px;margin-top:-8px;fill:#a3a3a3;transition:fill .15s}
.b:hover .i,.b:focus-visible .i{fill:#d4d4d4}
.i .cut{fill:none;stroke:#2a2a2a;transition:stroke .15s}
.b:hover .i .cut,.b:focus-visible .i .cut{stroke:#303030}
.b:active .i .cut{stroke:#363636}
@media (prefers-reduced-motion:reduce){.i,.i .cut{transition:none}}
.b small{margin-top:1px;font-family:var(--mono);font-size:11px;line-height:1.2;color:#9a9a9a;transition:color .15s}
.b small.ok{color:#8fd19e}
.b small.err{color:#e08f8f}
.wide{grid-column:1/-1;justify-self:center;width:calc(50% - 5px)}
@media (max-width:340px){.bio{font-size:10.5px}}
@media (prefers-reduced-motion:reduce){.b,.b small{transition:none}}
</style>

<script>
document.querySelectorAll("[data-copy]").forEach(function(el){
  var s=el.querySelector("small"),o=s.textContent,timer;
  function show(text,cls){
    clearTimeout(timer);
    s.textContent=text;
    s.className=cls||"";
    timer=setTimeout(function(){s.textContent=o;s.className=""},1500);
  }
  function viaFallback(t){
    if(fallback(t)){show("copied","ok")}else{show("failed","err")}
  }
  el.addEventListener("click",function(){
    var t=el.getAttribute("data-copy");
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){show("copied","ok")},function(){viaFallback(t)});
    }else{
      viaFallback(t);
    }
  });
});
function fallback(t){
  var ok=false;
  try{
    var a=document.createElement("textarea");
    a.value=t;a.setAttribute("readonly","");
    a.style.position="fixed";a.style.opacity="0";
    document.body.appendChild(a);a.select();
    ok=document.execCommand("copy");
    document.body.removeChild(a);
  }catch(e){}
  return ok;
}
</script>
